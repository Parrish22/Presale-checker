services:
  - type: worker
    name: presale-breakout-screener
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python presale_tracker.py"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CHANNEL_ID
        sync: false
